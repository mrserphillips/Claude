<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>sp_antilag audio</title></head>
<body>
<script>
// Synthesised exhaust pops / bangs. Nothing is prerecorded: every shot is built from
// noise + a sub "thump" with slight randomisation so no two hits sound identical.
let ctx = null, master = null, noise = null, shaper = null, hardShaper = null;

function makeCurve(k) {
    const n = 2048, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; curve[i] = Math.tanh(x * k); }
    return curve;
}

function init(existing) {
    if (ctx) return;
    ctx = existing || new (window.AudioContext || window.webkitAudioContext)();

    // Limiter only: catches clipping but leaves bangs much louder than pops.
    master = ctx.createDynamicsCompressor();
    master.threshold.value = -2; master.knee.value = 0; master.ratio.value = 20;
    master.attack.value = 0.001; master.release.value = 0.1;
    // Soft clipper after the limiter so stacked bangs never hard-clip.
    const clip = ctx.createWaveShaper();
    const n = 2048, c = new Float32Array(n), norm = Math.tanh(1.5);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(x * 1.5) / norm * 0.98; }
    clip.curve = c;
    master.connect(clip); clip.connect(ctx.destination);

    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    shaper = makeCurve(4);
    hardShaper = makeCurve(12);
}

const rnd = (a, b) => a + Math.random() * (b - a);

// Every shot = crack (tiny full-band impulse) + punch (overdriven pitch-dropping tone, the
// part you feel) + a short body of filtered noise. Kept SHORT on purpose: a long noise tail
// sounds like a dump valve / air release instead of a bang.
const KINDS = {
    //     crack gain/len,   punch Hz from->to, len, gain, drive,  body filter Hz, len, gain,  slapback
    pop:  { crack: [0.35, 0.006], punch: [220, 90, 0.035, 0.35, 'soft'], body: [1400, 0.05, 0.35], slap: 0 },
    bang: { crack: [1.80, 0.008], punch: [170, 55, 0.090, 1.40, 'hard'], body: [900,  0.07, 1.10], slap: 0.18 },
    mega: { crack: [2.50, 0.010], punch: [140, 40, 0.140, 1.80, 'hard'], body: [700,  0.10, 1.40], slap: 0.28 },
};

function envGain(t, peak, dur) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    return g;
}

function shot(kind, volume, muffle, at, noSlap) {
    const k = KINDS[kind] || KINDS.pop;
    const t = at || ctx.currentTime + 0.005;
    const scale = rnd(0.9, 1.1);
    const curve = k.punch[4] === 'hard' ? hardShaper : shaper;

    // Distance muffling: further away = duller.
    const out = ctx.createBiquadFilter();
    out.type = 'lowpass';
    out.frequency.value = 600 + 17000 * Math.pow(1 - Math.min(Math.max(muffle, 0), 1), 2);
    const vol = ctx.createGain();
    vol.gain.value = volume;
    out.connect(vol); vol.connect(master);

    // Crack
    const c = ctx.createBufferSource(); c.buffer = noise;
    const cg = envGain(t, k.crack[0], k.crack[1]);
    c.connect(cg); cg.connect(out);
    c.start(t, Math.random() * 0.5); c.stop(t + k.crack[1] + 0.01);

    // Punch: overdriving the tone adds harmonics, so it is heard on headsets, not just subs.
    const [f0, f1, pDur, pGain] = k.punch;
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f0 * scale, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + pDur);
    const pre = ctx.createGain(); pre.gain.value = 3;
    const ws = ctx.createWaveShaper(); ws.curve = curve;
    const og = envGain(t, pGain, pDur * scale);
    o.connect(pre); pre.connect(ws); ws.connect(og); og.connect(out);
    o.start(t); o.stop(t + pDur * scale + 0.01);

    // Body
    const [bF, bDur, bGain] = k.body;
    const n = ctx.createBufferSource(); n.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = bF * rnd(0.85, 1.2); f.Q.value = 0.8;
    const bws = ctx.createWaveShaper(); bws.curve = curve;
    const bg = envGain(t, bGain, bDur * scale);
    n.connect(f); f.connect(bws); bws.connect(bg); bg.connect(out);
    n.start(t, Math.random() * 0.5); n.stop(t + bDur * scale + 0.01);

    // Slapback: ONE discrete echo off the buildings, not a hissy reverb tail.
    if (k.slap && !noSlap) shot(kind === 'mega' ? 'bang' : 'pop', volume * k.slap, Math.min(1, muffle + 0.35), t + rnd(0.09, 0.14), true);

    // Mega = a double report.
    if (kind === 'mega' && !noSlap) shot('bang', volume * 0.8, muffle, t + rnd(0.035, 0.06), true);
}

window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.action !== 'sp_antilag') return;
    init();
    if (ctx.state === 'suspended') ctx.resume();
    shot(m.kind, Math.max(0, Math.min(m.volume || 0, 1.5)), m.muffle || 0);
});
</script>
</body>
</html>
